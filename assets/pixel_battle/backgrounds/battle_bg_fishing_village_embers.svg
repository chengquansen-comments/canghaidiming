  <ellipse cx="612" cy="246" rx="170" ry="78" fill="#343837" opacity="0.24" filter="url(#softBlur)"/>
  <ellipse cx="780" cy="298" rx="132" ry="64" fill="#272c2c" opacity="0.23" filter="url(#softBlur)"/>
