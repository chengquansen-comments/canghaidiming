  <path d="M870 608 L1260 552" stroke="#070808" stroke-width="20" stroke-linecap="round" opacity="0.92"/>
  <path d="M760 628 L1018 540" stroke="#090a0a" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M38 650 L238 614 L458 642 L646 602" stroke="#111" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.58"/>
  <path d="M900 646 L1034 612 L1268 632" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.54"/>

  <!-- subtle vignette -->
  <rect width="1280" height="720" fill="#050606" opacity="0.10"/>
