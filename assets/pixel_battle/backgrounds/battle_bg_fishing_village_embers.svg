<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c9a8"/>
      <stop offset="0.54" stop-color="#879195"/>
      <stop offset="1" stop-color="#2e3435"/>
    </linearGradient>
    <linearGradient id="tide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d525b" stop-opacity="0.42"/>
      <stop offset="0.58" stop-color="#5d6b6e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#263436" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="55%" r="58%">
      <stop offset="0" stop-color="#b94a2e" stop-opacity="0.68"/>
      <stop offset="0.46" stop-color="#7b261f" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2a1513" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="#1a1b1a" opacity="0.12"/>

  <!-- distant coast and low tide -->
  <path d="M0 362 C160 330 310 368 470 342 C650 314 805 356 960 332 C1090 312 1180 326 1280 304 L1280 441 L0 446 Z" fill="url(#tide)"/>
