  <!-- fire from behind the village, not from sea side -->
  <ellipse cx="512" cy="476" rx="138" ry="88" fill="url(#ember)" filter="url(#softBlur)"/>
  <ellipse cx="805" cy="468" rx="110" ry="70" fill="url(#ember)" filter="url(#softBlur)" opacity="0.75"/>
  <path d="M450 505 C468 456 500 458 496 408 C524 452 552 454 536 510 Z" fill="#8b2c21" opacity="0.72"/>
  <path d="M774 502 C790 466 824 460 816 418 C844 454 872 468 858 512 Z" fill="#7d2920" opacity="0.64"/>
