  <path d="M944 324 L1002 314 L1048 324 L1014 333 Z" fill="#1d2527" opacity="0.44"/>
  <path d="M989 277 L1004 314 L974 319 Z" fill="#222b2d" opacity="0.34"/>
  <path d="M1072 337 L1120 331 L1152 339 L1112 346 Z" fill="#202728" opacity="0.34"/>

  <!-- village roof silhouettes -->
  <path d="M78 425 L188 360 L312 428 Z" fill="#181b1a" opacity="0.76"/>
  <path d="M136 425 L278 425 L262 512 L118 512 Z" fill="#111312" opacity="0.68"/>
  <path d="M328 446 L470 374 L646 452 Z" fill="#1b1c1a" opacity="0.74"/>
  <path d="M392 448 L590 448 L566 544 L370 548 Z" fill="#111211" opacity="0.70"/>
