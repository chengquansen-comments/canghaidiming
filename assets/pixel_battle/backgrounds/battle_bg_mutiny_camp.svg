  <path d="M64 566 L92 710 L46 710 Z M118 556 L144 710 L98 710 Z M996 548 L1028 710 L976 710 Z M1084 560 L1114 710 L1062 710 Z M1224 534 L1254 710 L1202 710 Z" fill="#070808" opacity="0.92"/>
