<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="campSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b789"/>
      <stop offset="0.46" stop-color="#8b806a"/>
      <stop offset="1" stop-color="#282d30"/>
    </linearGradient>
    <linearGradient id="coldGround" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c3a30" stop-opacity="0.72"/>
      <stop offset="0.56" stop-color="#5f563e" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#20292f" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="flagDullRed" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#6f2923" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#2d1715" stop-opacity="0.74"/>
    </radialGradient>
    <filter id="dustBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#campSky)"/>
  <rect width="1280" height="720" fill="#121514" opacity="0.13"/>

  <!-- heavy cloud and cold wind -->
  <ellipse cx="270" cy="156" rx="250" ry="76" fill="#343b3d" opacity="0.20" filter="url(#dustBlur)"/>
