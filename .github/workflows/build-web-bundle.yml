name: Build Web Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'tools/**'
      - 'web_shell.html'
      - '.github/workflows/build-web-bundle.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      CANGHAI_WEB_TOTAL_BUDGET_MB: '160'
      CANGHAI_WEB_PCK_BUDGET_MB: '120'
      CANGHAI_WEB_WASM_BUDGET_MB: '40'
      CANGHAI_WEB_SMOKE_BROWSER: '0'
      CANGHAI_WEB_SMOKE_BATTLE_HUD: '0'
      CANGHAI_WEB_SMOKE_BATTLE_ROUND_CORE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          include-templates: true

      - name: Prepare scripts
        run: chmod +x tools/*.sh || true

      - name: Build web bundle
        run: tools/build_web_bundle.sh

      - name: Prepare GitHub Pages bundle
        run: touch build/web/.nojekyll

      - name: Upload web bundle directory
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-directory
          path: build/web

      - name: Upload web bundle zip
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-zip
          path: build/web.zip

      - name: Upload web bundle metadata
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-metadata
          path: |
            build/web/manifest.json
            build/web/checksums.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
