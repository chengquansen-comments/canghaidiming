<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battle Sprite Anchor Marker</title>
  <style>
    :root { color-scheme: dark; --bg:#10151d; --panel:#182231; --line:#bfa06a; --text:#e8edf4; --muted:#aab6c5; --accent:#f2b35e; --blue:#7cb7ff; --red:#ff6b6b; --green:#7ee787; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    header { padding:14px 18px; border-bottom:1px solid rgba(191,160,106,.38); background:#111a26; position:sticky; top:0; z-index:10; }
    h1 { margin:0 0 6px; font-size:20px; }
    .hint { color:var(--muted); font-size:13px; line-height:1.45; }
    main { display:grid; grid-template-columns:360px 1fr; min-height:calc(100vh - 76px); }
    aside { border-right:1px solid rgba(191,160,106,.28); background:var(--panel); padding:14px; overflow:auto; }
    section.stage { overflow:auto; padding:18px; }
    .group { border:1px solid rgba(191,160,106,.30); background:rgba(255,255,255,.025); border-radius:12px; padding:12px; margin-bottom:12px; }
    .group-title { font-size:14px; font-weight:700; color:#ffe0ad; margin-bottom:8px; }
    label { display:block; color:var(--muted); font-size:12px; margin:8px 0 4px; }
    input, select, textarea, button { width:100%; border:1px solid rgba(191,160,106,.30); background:#0f1722; color:var(--text); border-radius:8px; padding:8px 9px; font:inherit; }
    textarea { min-height:190px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
    button { cursor:pointer; background:#263246; margin-top:8px; font-weight:650; }
    button:hover { border-color:var(--accent); }
    button.primary { background:#514027; border-color:#e0ad67; }
    button.danger { background:#46262b; border-color:#d16a76; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .frame-card { padding:8px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.18); font-size:12px; line-height:1.45; margin-bottom:8px; }
    .frame-card.active { border-color:var(--accent); background:rgba(242,179,94,.08); }
    .ok { color:var(--green); } .missing { color:var(--red); }
    .mini-actions { display:flex; gap:6px; margin-top:6px; }
    .mini-actions button { margin:0; padding:5px 6px; font-size:12px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; color:var(--muted); font-size:13px; }
    .toolbar span { white-space:nowrap; }
    canvas { image-rendering:auto; background:linear-gradient(45deg,#2a2f38 25%,transparent 25%),linear-gradient(-45deg,#2a2f38 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2f38 75%),linear-gradient(-45deg,transparent 75%,#2a2f38 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; background-color:#1b2028; border:1px solid rgba(191,160,106,.35); border-radius:10px; display:block; }
    .canvas-wrap { width:max-content; min-width:100%; }
    code { color:#ffd18a; }
  </style>
</head>
<body>
<header>
  <h1>Battle Sprite Anchor Marker</h1>
  <div class="hint">加载战斗动作 sheet，自动检测脚底锚点；点击画布可手工改当前帧脚点。导出的 <code>battle_sprite_anchors.json</code> 可直接放入 <code>data/</code> 供 Godot 读取。</div>
</header>
<main>
  <aside>
    <div class="group">
      <div class="group-title">1. 载入图片</div>
      <label>Sprite sheet PNG</label>
      <input id="fileInput" type="file" accept="image/png,image/webp,image/jpeg" />
      <label>asset_id / runtime key</label>
      <input id="assetId" value="spearman" />
      <div class="row3">
        <div><label>帧宽</label><input id="frameW" type="number" value="1536" /></div>
        <div><label>帧高</label><input id="frameH" type="number" value="512" /></div>
        <div><label>帧数</label><input id="frameCount" type="number" value="3" /></div>
      </div>
      <div class="row">
        <div><label>布局</label><select id="layout"><option value="vertical">竖排</option><option value="horizontal">横排</option></select></div>
        <div><label>缩放</label><input id="zoom" type="number" value="0.5" step="0.1" min="0.1" /></div>
      </div>
      <div class="row">
        <div><label>目标脚点 X</label><input id="targetX" type="number" value="768" /></div>
        <div><label>目标脚点 Y</label><input id="targetY" type="number" value="492" /></div>
      </div>
      <button class="primary" id="loadBtn">刷新切帧</button>
    </div>

    <div class="group">
      <div class="group-title">2. 自动检测</div>
      <div class="row">
        <div><label>背景</label><select id="bgMode"><option value="alpha">透明 Alpha</option><option value="green">绿幕 #00FF00</option></select></div>
        <div><label>底部采样带</label><input id="bottomBand" type="number" value="24" /></div>
      </div>
      <div class="row">
        <div><label>Alpha 阈值</label><input id="alphaThreshold" type="number" value="8" /></div>
        <div><label>颜色容差</label><input id="colorTolerance" type="number" value="16" /></div>
      </div>
      <button id="autoDetectBtn">自动描脚点</button>
      <button id="copyTargetBtn">全部设为目标脚点</button>
    </div>

    <div class="group">
      <div class="group-title">3. 帧列表</div>
      <div id="frameList"></div>
    </div>

    <div class="group">
      <div class="group-title">4. 导出给游戏</div>
      <button class="primary" id="exportBtn">生成 JSON</button>
      <button id="downloadBtn">下载 battle_sprite_anchors.json</button>
      <label>JSON</label>
      <textarea id="jsonOutput" spellcheck="false"></textarea>
    </div>
  </aside>
  <section class="stage">
    <div class="toolbar">
      <span id="fileInfo">未加载图片</span>
      <span>红十字=当前帧脚点</span>
      <span>蓝十字=目标脚点</span>
      <span>黄框=自动检测 bbox</span>
      <span>点击画布=设置当前帧脚点</span>
    </div>
    <div class="canvas-wrap"><canvas id="canvas" width="900" height="600"></canvas></div>
  </section>
</main>
<script>
const state = { image:null, imageName:"", frames:[], active:0 };
const el = id => document.getElementById(id);
const canvas = el("canvas");
const ctx = canvas.getContext("2d");

function intValue(id, fallback){ const n = parseInt(el(id).value,10); return Number.isFinite(n) ? n : fallback; }
function floatValue(id, fallback){ const n = parseFloat(el(id).value); return Number.isFinite(n) ? n : fallback; }
function frameRect(i){ const w=intValue("frameW",1536), h=intValue("frameH",512); return el("layout").value === "vertical" ? {x:0,y:i*h,w,h} : {x:i*w,y:0,w,h}; }
function targetAnchor(){ return {x:intValue("targetX",768), y:intValue("targetY",492)}; }
function frameCount(){ return Math.max(1, intValue("frameCount",3)); }
function zoom(){ return Math.max(0.05, floatValue("zoom",0.5)); }
function ensureFrames(){
  const t = targetAnchor();
  const count = frameCount();
  state.frames = Array.from({length:count}, (_,i) => state.frames[i] || {index:i, anchor:null, detected:null, bbox:null, target:{...t}, shift:null});
  state.frames.forEach(f => { f.target = {...t}; if (f.anchor) f.shift = {x:t.x-f.anchor.x, y:t.y-f.anchor.y}; });
  if (state.active >= count) state.active = count - 1;
}
function loadImageFromFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { state.image=img; state.imageName=file.name; ensureFrames(); autoFitZoom(); renderAll(); URL.revokeObjectURL(url); };
  img.src = url;
}
function autoFitZoom(){
  const w = intValue("frameW",1536), h = intValue("frameH",512), count = frameCount();
  const totalH = el("layout").value === "vertical" ? h*count : h;
  const totalW = el("layout").value === "vertical" ? w : w*count;
  const z = Math.min(0.75, Math.max(0.15, (window.innerWidth-420)/Math.max(1,totalW)));
  el("zoom").value = z.toFixed(2);
}
function renderAll(){ ensureFrames(); drawCanvas(); renderFrameList(); exportJson(false); }
function drawCross(x,y,color,r=12){ ctx.strokeStyle=color; ctx.lineWidth=2/zoom(); ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke(); }
function drawCanvas(){
  const z=zoom(), w=intValue("frameW",1536), h=intValue("frameH",512), count=frameCount(), vertical=el("layout").value === "vertical";
  const cw = (vertical ? w : w*count) * z, ch = (vertical ? h*count : h) * z;
  canvas.width = Math.max(1, Math.ceil(cw)); canvas.height = Math.max(1, Math.ceil(ch));
  ctx.setTransform(z,0,0,z,0,0); ctx.clearRect(0,0,canvas.width/z,canvas.height/z);
  if (state.image) ctx.drawImage(state.image,0,0);
  const t = targetAnchor();
  for (let i=0;i<count;i++){
    const r=frameRect(i), f=state.frames[i];
    ctx.strokeStyle = i===state.active ? "#f2b35e" : "rgba(255,255,255,.35)"; ctx.lineWidth = i===state.active ? 4/z : 2/z; ctx.strokeRect(r.x,r.y,r.w,r.h);
    if (f.bbox){ ctx.strokeStyle="#ffd65c"; ctx.lineWidth=2/z; ctx.strokeRect(r.x+f.bbox.x,r.y+f.bbox.y,f.bbox.w,f.bbox.h); }
    drawCross(r.x+t.x,r.y+t.y,"#7cb7ff",16);
    if (f.anchor) drawCross(r.x+f.anchor.x,r.y+f.anchor.y,"#ff6b6b",18);
    ctx.fillStyle = "#fff"; ctx.font = `${18/z}px sans-serif`; ctx.fillText(`#${i}`, r.x+12, r.y+26);
  }
}
function subjectPixel(data, idx){
  const a = data[idx+3]; if (a <= intValue("alphaThreshold",8)) return false;
  if (el("bgMode").value === "green"){
    const tol=intValue("colorTolerance",16); const r=data[idx], g=data[idx+1], b=data[idx+2];
    if (Math.max(Math.abs(r-0), Math.abs(g-255), Math.abs(b-0)) <= tol) return false;
  }
  return true;
}
function detectFrame(i){
  if (!state.image) return;
  const r=frameRect(i); const off=document.createElement("canvas"); off.width=r.w; off.height=r.h; const c=off.getContext("2d", {willReadFrequently:true}); c.drawImage(state.image,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
  const img=c.getImageData(0,0,r.w,r.h); const d=img.data;
  let minX=r.w,minY=r.h,maxX=-1,maxY=-1,count=0;
  for (let y=0;y<r.h;y++) for (let x=0;x<r.w;x++){ const idx=(y*r.w+x)*4; if(subjectPixel(d,idx)){ minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); count++; }}
  const f=state.frames[i];
  if (count<=0){ f.detected=null; f.anchor=null; f.bbox=null; f.shift=null; return; }
  const band=Math.max(1,intValue("bottomBand",24)); const bandTop=Math.max(0,maxY-band+1); const xs=[]; let footY=maxY;
  for (let y=bandTop;y<=maxY;y++) for (let x=minX;x<=maxX;x++){ const idx=(y*r.w+x)*4; if(subjectPixel(d,idx)){ xs.push(x); footY=Math.max(footY,y); }}
  xs.sort((a,b)=>a-b); const footX = xs.length ? xs[Math.floor(xs.length/2)] : Math.floor((minX+maxX)/2);
  const t=targetAnchor();
  f.detected={x:footX,y:footY}; f.anchor={x:footX,y:footY}; f.bbox={x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}; f.shift={x:t.x-footX,y:t.y-footY}; f.opaque_pixels=count;
}
function autoDetectAll(){ ensureFrames(); for(let i=0;i<frameCount();i++) detectFrame(i); renderAll(); }
function setAllTarget(){ const t=targetAnchor(); ensureFrames(); state.frames.forEach(f=>{ f.anchor={...t}; f.shift={x:0,y:0}; }); renderAll(); }
function renderFrameList(){
  const root=el("frameList"); root.innerHTML="";
  state.frames.forEach(f=>{
    const div=document.createElement("div"); div.className=`frame-card ${f.index===state.active?'active':''} ${f.anchor?'ok':'missing'}`;
    div.innerHTML=`<b>Frame ${f.index}</b> <span class="${f.anchor?'ok':'missing'}">${f.anchor?'已描点':'未描点'}</span><br>anchor=${f.anchor?`${f.anchor.x},${f.anchor.y}`:'-'}<br>target=${f.target.x},${f.target.y}<br>shift=${f.shift?`${f.shift.x},${f.shift.y}`:'-'}`;
    const actions=document.createElement("div"); actions.className="mini-actions";
    const select=document.createElement("button"); select.textContent="选中"; select.onclick=()=>{ state.active=f.index; renderAll(); };
    const detect=document.createElement("button"); detect.textContent="自动"; detect.onclick=()=>{ detectFrame(f.index); state.active=f.index; renderAll(); };
    const clear=document.createElement("button"); clear.textContent="清除"; clear.onclick=()=>{ f.anchor=null; f.shift=null; renderAll(); };
    actions.append(select,detect,clear); div.appendChild(actions); root.appendChild(div);
  });
}
function exportJson(write=true){
  ensureFrames(); const asset=el("assetId").value.trim() || "unnamed_sprite";
  const fw=intValue("frameW",1536), fh=intValue("frameH",512), layout=el("layout").value;
  const payload={ version:1, assets:{} };
  payload.assets[asset]={ sheet: state.imageName || "", frame_size:[fw,fh], layout, default_anchor:[targetAnchor().x,targetAnchor().y], frames:{} };
  state.frames.forEach(f=>{ payload.assets[asset].frames[String(f.index)]={ foot_anchor:f.anchor?[f.anchor.x,f.anchor.y]:[f.target.x,f.target.y], target_anchor:[f.target.x,f.target.y], shift:f.shift?[f.shift.x,f.shift.y]:[0,0], bbox:f.bbox?[f.bbox.x,f.bbox.y,f.bbox.w,f.bbox.h]:null }; });
  const text=JSON.stringify(payload,null,2); if(write) el("jsonOutput").value=text; return text;
}
function downloadJson(){ const text=exportJson(true); const blob=new Blob([text+"\n"],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="battle_sprite_anchors.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
canvas.addEventListener("click", ev=>{ if(!state.image) return; const rect=canvas.getBoundingClientRect(); const z=zoom(); const x=(ev.clientX-rect.left)/z, y=(ev.clientY-rect.top)/z; for(let i=0;i<frameCount();i++){ const r=frameRect(i); if(x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h){ const f=state.frames[i]; const ax=Math.round(x-r.x), ay=Math.round(y-r.y); const t=targetAnchor(); state.active=i; f.anchor={x:ax,y:ay}; f.shift={x:t.x-ax,y:t.y-ay}; renderAll(); return; } } });
el("fileInput").addEventListener("change", e=>{ const file=e.target.files[0]; if(file) loadImageFromFile(file); });
el("loadBtn").onclick=renderAll; el("autoDetectBtn").onclick=autoDetectAll; el("copyTargetBtn").onclick=setAllTarget; el("exportBtn").onclick=()=>exportJson(true); el("downloadBtn").onclick=downloadJson;
["frameW","frameH","frameCount","layout","zoom","targetX","targetY"].forEach(id=>el(id).addEventListener("change",renderAll));
renderAll();
</script>
</body>
</html>
